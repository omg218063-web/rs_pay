
<div class="auth-tabs">
  <button type="button" id="loginTab" class="auth-tab active">
    লগইন
  </button>
  <button type="button" id="registerTab" class="auth-tab">
    রেজিস্ট্রেশন
  </button>
</div>

<form id="authForm">

  <label id="nameLabel" class="hidden">
    আপনার নাম
    <input
      id="nameInput"
      name="name"
      type="text"
      maxlength="60"
      placeholder="আপনার পূর্ণ নাম"
    >
  </label>

  <label>
    মোবাইল নম্বর
    <input
      id="phoneInput"
      name="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      required
      maxlength="16"
      placeholder="01XXXXXXXXX"
    >
  </label>

  <div id="verifyNote" class="verification-note hidden">
    ◷ মোবাইল নম্বর যাচাই — পরে চালু হবে
  </div>

  <label>
    পাসওয়ার্ড
    <input
      id="passwordInput"
      name="password"
      type="password"
      required
      minlength="10"
      maxlength="72"
      placeholder="কমপক্ষে ১০ অক্ষর"
    >
  </label>

  <p id="formMessage" class="form-message"></p>

  <button
    class="btn btn-gold auth-submit"
    id="submitAuth"
    type="submit"
  >
    লগইন করুন
  </button>

</form>
