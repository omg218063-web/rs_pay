<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin — RS PAY</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/common.js"></script>
</head>
<body>
  <!-- login -->
  <section class="a-login" id="loginBox" hidden>
    <form class="card a-login-card" id="loginForm">
      <div class="logo-mark" style="margin:0 auto 12px;width:52px;height:52px;font-size:20px">RS</div>
      <h1>অ্যাডমিন লগইন</h1>
      <p class="muted small" style="margin-bottom:18px">শুধুমাত্র অনুমোদিত ব্যক্তির জন্য</p>
      <div class="field"><label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit">প্রবেশ করুন</button>
      <p class="a-err" id="lerr" hidden></p>
    </form>
  </section>

  <!-- app -->
  <div class="a-layout" id="appBox" hidden>
    <aside class="a-side" id="aSide">
      <div class="brand"><span class="logo-mark" data-logo>RS</span><span><span data-brand-name>RS PAY</span><small class="muted" style="display:block;font-size:11px;font-weight:500">Admin Panel</small></span></div>
      <nav id="aNav"></nav>
      <div class="a-foot">
        <a class="btn btn-ghost btn-sm btn-block" href="/" target="_blank" rel="noopener">সাইট দেখুন ↗</a>
        <button class="btn btn-ghost btn-sm btn-block" id="aLogout">লগআউট</button>
      </div>
    </aside>
    <div class="a-main">
      <header class="a-top">
        <button class="a-menu" id="aMenu" aria-label="মেনু">☰</button>
        <h1 id="aTitle">ড্যাশবোর্ড</h1>
        <span id="modeBadge"></span>
      </header>
      <main id="aView" class="a-view"></main>
    </div>
  </div>
  <div class="a-scrim" id="aScrim" hidden></div>
  <script src="/js/admin.js"></script>
</body>
</html>
