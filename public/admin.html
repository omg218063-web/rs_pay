
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RS PAY | Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-wrap">
    <section class="login-box" id="adminLogin">
      <div class="logo">RS <span>PAY</span></div>
      <h1>Admin Login</h1>
      <p>আপনার অ্যাডমিন পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>
      <form id="adminLoginForm">
        <label>Admin Password</label>
        <input id="adminPassword" type="password" required autocomplete="current-password">
        <button type="submit">LOGIN</button>
        <p id="loginMessage"></p>
      </form>
    </section>

    <section id="adminDashboard" class="hidden">
      <header class="admin-header">
        <div class="logo">RS <span>PAY</span></div>
        <div><span>ADMIN CONTROL PANEL</span><button id="adminLogout">Logout</button></div>
      </header>

      <div class="admin-intro">
        <div><small>CONTROL CENTER</small><h1>Admin Dashboard</h1><p>আপনার ওয়েবসাইটের কনটেন্ট ও সার্ভিস পরিচালনা করুন।</p></div>
      </div>

      <nav class="admin-tabs">
        <button class="active" data-panel="contentPanel">Website Content</button>
        <button data-panel="bannerPanel">Banners</button>
        <button data-panel="servicePanel">Services</button>
        <button data-panel="userPanel">Users</button>
      </nav>

      <section class="panel" id="contentPanel">
        <h2>Landing Page Content</h2>
        <form id="contentForm">
          <label>Hero Title</label>
          <input id="heroTitleInput" maxlength="180">
          <label>Hero Subtitle</label>
          <textarea id="heroSubtitleInput" maxlength="500"></textarea>
          <button type="submit">Save Content</button>
          <p class="message" id="contentMessage"></p>
        </form>
      </section>

      <section class="panel hidden" id="bannerPanel">
        <h2>Banner Management</h2>
        <form id="bannerForm">
          <input type="hidden" id="bannerId">
          <label>Banner Title</label>
          <input id="bannerTitle" required maxlength="100">
          <label>Description</label>
          <textarea id="bannerDescription" maxlength="300"></textarea>
          <label>Image URL</label>
          <input id="bannerImage" type="url" placeholder="https://example.com/banner.jpg">
          <label>Link URL (optional)</label>
          <input id="bannerLink" type="url">
          <label>Position</label>
          <select id="bannerPosition">
            <option value="landing_top">Landing Top</option>
            <option value="landing_middle">Landing Middle</option>
            <option value="dashboard_home">Dashboard Home</option>
          </select>
          <label class="check"><input id="bannerEnabled" type="checkbox" checked> Enabled</label>
          <button type="submit">Save Banner</button>
          <button type="button" class="secondary" id="bannerReset">Clear</button>
          <p class="message" id="bannerMessage"></p>
        </form>
        <div id="bannerList" class="admin-list"></div>
      </section>

      <section class="panel hidden" id="servicePanel">
        <h2>Service Management</h2>
        <form id="serviceForm">
          <input type="hidden" id="serviceId">
          <label>Service Name</label>
          <input id="serviceName" required maxlength="80">
          <label>Description</label>
          <textarea id="serviceDescription" maxlength="250"></textarea>
          <label>Icon (Emoji)</label>
          <input id="serviceIcon" maxlength="8" placeholder="✦">
          <label class="check"><input id="serviceEnabled" type="checkbox" checked> Enabled</label>
          <button type="submit">Save Service</button>
          <button type="button" class="secondary" id="serviceReset">Clear</button>
          <p class="message" id="serviceMessage"></p>
        </form>
        <div id="serviceList" class="admin-list"></div>
      </section>

      <section class="panel hidden" id="userPanel">
        <h2>Registered Users</h2>
        <p>এখানে শুধু অ্যাকাউন্টের তালিকা দেখা যাবে।</p>
        <div id="userList" class="admin-list"></div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
